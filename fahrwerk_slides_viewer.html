<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover para usar a tela toda em iPhone; zoom liberado para ler detalhe do slide -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001e50">
<title>FAHRWERK · Visualizador de Slides</title>
<style>
  :root{
    --vw-deep:#001226;
    --vw-blue:#001E50;
    --vw-blue2:#003087;
    --vw-accent:#0040C1;
    --vw-edge:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--vw-deep);color:#fff;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  }

  /* ============================================================
     PALCO — em RETRATO é só a tela de aviso (não mostra o slide).
     Em PAISAGEM vira a moldura fullscreen do slide.
     ============================================================ */
  .stage{
    position:relative;
    min-height:100vh;            /* fallback */
    min-height:100dvh;           /* corrige barra do navegador no iOS */
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }

  /* ---------- TELA DE AVISO (RETRATO) ---------- */
  .rotate{
    text-align:center;padding:32px;max-width:520px;
    background:linear-gradient(165deg,#001226,#001E50 55%,#002a6e);
  }
  .rotate .deckTag{
    font-size:13px;letter-spacing:2px;text-transform:uppercase;
    color:#7fa4dc;font-weight:700;margin-bottom:6px;
  }
  .rotate .deckTitle{font-size:22px;font-weight:700;line-height:1.25;margin-bottom:38px;}

  /* celular animado girando */
  .phone{
    width:78px;height:140px;margin:0 auto 30px;
    border:4px solid #fff;border-radius:16px;position:relative;
    transform-origin:center;animation:tilt 2.6s ease-in-out infinite;
  }
  .phone::before{ /* alto-falante */
    content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:26px;height:4px;border-radius:3px;background:#fff;
  }
  .phone::after{ /* botão */
    content:"";position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
    width:18px;height:18px;border:3px solid #fff;border-radius:50%;
  }
  @keyframes tilt{
    0%,18%{transform:rotate(0deg);}
    50%,68%{transform:rotate(-90deg);}
    100%{transform:rotate(0deg);}
  }
  .rotate .msg{font-size:21px;font-weight:700;line-height:1.35;margin-bottom:10px;}
  .rotate .sub{font-size:15px;color:#a9c0e4;line-height:1.5;}
  .rotate .count{
    margin-top:34px;display:inline-block;padding:8px 18px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid var(--vw-edge);
    font-size:15px;font-weight:600;color:#cfe0f7;
  }

  /* ---------- VISOR FULLSCREEN (PAISAGEM) ---------- */
  .viewer{display:none;}            /* escondido em retrato */
  .slideImg{
    width:100vw;height:100vh;height:100dvh;
    object-fit:contain;display:block;background:#000;
    user-select:none;-webkit-user-drag:none;
  }

  /* barra superior sobreposta */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;gap:12px;
    padding:max(10px,env(safe-area-inset-top)) 16px 18px;
    padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));
    background:linear-gradient(to bottom,rgba(0,8,24,.78),rgba(0,8,24,0));
    transition:opacity .3s ease;
  }
  .topbar .title{flex:1;font-size:16px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .count{
    font-size:14px;font-weight:600;color:#cfe0f7;
    padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid var(--vw-edge);
  }
  .iconBtn{
    flex:none;width:40px;height:40px;border:1px solid var(--vw-edge);
    border-radius:12px;background:rgba(0,0,0,.45);color:#fff;
    font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s ease,transform .1s ease;
  }
  .iconBtn:active{transform:scale(.92);background:var(--vw-accent);}

  /* setas laterais */
  .arrow{
    position:fixed;top:50%;transform:translateY(-50%);z-index:30;
    width:58px;height:58px;border-radius:50%;
    background:rgba(0,12,30,.55);border:1px solid var(--vw-edge);
    color:#fff;font-size:30px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(4px);transition:background .15s ease,transform .1s ease,opacity .3s;
  }
  .arrow:active{transform:translateY(-50%) scale(.9);background:var(--vw-accent);}
  .arrow.prev{left:max(10px,env(safe-area-inset-left));}
  .arrow.next{right:max(10px,env(safe-area-inset-right));}
  .arrow.off{opacity:.25;pointer-events:none;}

  /* dica que some sozinha */
  .swipeHint{
    position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:30;
    font-size:13px;color:#cfe0f7;background:rgba(0,12,30,.6);
    padding:7px 16px;border-radius:999px;border:1px solid var(--vw-edge);
    transition:opacity .6s ease;
  }
  .swipeHint.hide{opacity:0;}

  /* >>> A CHAVE DE TUDO: vira PAISAGEM => mostra o visor, esconde o aviso <<< */
  @media (orientation:landscape){
    .rotate{display:none;}
    .viewer{display:block;}
    .stage{background:#000;}
  }
</style>
</head>
<body>

  <div class="stage">

    <!-- ===== RETRATO: aviso ===== -->
    <div class="rotate">
      <div class="deckTag">Fahrwerk · Apresentação</div>
      <div class="deckTitle" id="rotTitle">—</div>
      <div class="phone" aria-hidden="true"></div>
      <div class="msg">Vire o celular para melhor visualização</div>
      <div class="sub">Os slides abrem em tela cheia quando você gira o aparelho.</div>
      <div class="count" id="rotCount">— / —</div>
    </div>

    <!-- ===== PAISAGEM: visor fullscreen ===== -->
    <div class="viewer">
      <img class="slideImg" id="slideImg" alt="">
      <div class="topbar">
        <button class="iconBtn" id="btnClose" aria-label="Fechar">✕</button>
        <div class="title" id="topTitle">—</div>
        <div class="count" id="topCount">— / —</div>
        <button class="iconBtn" id="btnFull" aria-label="Tela cheia">⛶</button>
      </div>
      <button class="arrow prev" id="btnPrev" aria-label="Anterior">‹</button>
      <button class="arrow next" id="btnNext" aria-label="Próximo">›</button>
      <div class="swipeHint" id="swipeHint">Deslize ou use as setas</div>
    </div>

  </div>

<script>
/* ============================================================
   CONFIGURAÇÃO  —  só mexa aqui
   ============================================================ */
var DECK_TITLE = "Proteção das Mãos — Risco Mecânico";

// Cole as URLs (ou base64 "data:image/...") das suas imagens, NA ORDEM.
// Se deixar vazio, o app gera 9 slides de exemplo automaticamente.
var SLIDES = [
  // "https://fabioalves567-afk.github.io/fahrwerk-hub/img/maos_1.png",
  // "https://fabioalves567-afk.github.io/fahrwerk-hub/img/maos_2.png",
];
/* ============================================================ */

(function(){
  "use strict";

  // gera slides de exemplo se a lista estiver vazia
  function demo(n, total){
    var svg =
      "<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='800' viewBox='0 0 1280 800'>"+
      "<rect width='1280' height='800' fill='#eef2f7'/>"+
      "<rect width='1280' height='112' fill='#001E50'/>"+
      "<text x='48' y='72' font-family='Segoe UI,sans-serif' font-size='40' font-weight='700' fill='#fff'>"+DECK_TITLE+"</text>"+
      "<text x='1232' y='72' text-anchor='end' font-family='Segoe UI,sans-serif' font-size='34' fill='#9db4d6'>"+n+"/"+total+"</text>"+
      "<text x='48' y='560' font-family='Segoe UI,sans-serif' font-size='240' font-weight='800' fill='#001E50' opacity='0.10'>"+n+"</text>"+
      "<text x='48' y='280' font-family='Segoe UI,sans-serif' font-size='34' fill='#33425a'>Slide de exemplo — substitua pela sua imagem real.</text>"+
      "</svg>";
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  if(!SLIDES || SLIDES.length === 0){
    SLIDES = [];
    for(var i=1;i<=9;i++) SLIDES.push(demo(i,9));
  }

  var idx = 0;
  var total = SLIDES.length;

  var img      = document.getElementById("slideImg");
  var topTitle = document.getElementById("topTitle");
  var topCount = document.getElementById("topCount");
  var rotTitle = document.getElementById("rotTitle");
  var rotCount = document.getElementById("rotCount");
  var btnPrev  = document.getElementById("btnPrev");
  var btnNext  = document.getElementById("btnNext");
  var btnClose = document.getElementById("btnClose");
  var btnFull  = document.getElementById("btnFull");
  var hint     = document.getElementById("swipeHint");
  var stage    = document.querySelector(".stage");

  function preload(n){
    if(n>=0 && n<total){ var im = new Image(); im.src = SLIDES[n]; }
  }

  function render(){
    img.src = SLIDES[idx];
    img.alt = DECK_TITLE + " — slide " + (idx+1) + " de " + total;
    var label = (idx+1) + " / " + total;
    topTitle.textContent = DECK_TITLE;
    rotTitle.textContent = DECK_TITLE;
    topCount.textContent = label;
    rotCount.textContent = label;
    btnPrev.classList.toggle("off", idx === 0);
    btnNext.classList.toggle("off", idx === total-1);
    preload(idx+1); preload(idx-1);
  }

  function go(delta){
    var n = idx + delta;
    if(n < 0 || n > total-1) return;
    idx = n;
    render();
  }

  // botões (addEventListener — nada de onclick inline, p/ iOS Safari)
  btnPrev.addEventListener("click", function(){ go(-1); });
  btnNext.addEventListener("click", function(){ go(1); });

  // teclado (desktop)
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowLeft")  go(-1);
    if(e.key === "ArrowRight") go(1);
    if(e.key === "Escape")     closeViewer();
  });

  // swipe (toque)
  var x0 = null;
  stage.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 45){ go(dx < 0 ? 1 : -1); }
    x0 = null;
  }, {passive:true});

  // botão fechar: sai do fullscreen / avisa o HUB se estiver embutido / volta
  function closeViewer(){
    if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); return; }
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({type:"fahrwerk-slides-close"}, "*");
        return;
      }
    }catch(err){}
    if(history.length > 1) history.back();
  }
  btnClose.addEventListener("click", closeViewer);

  // tela cheia real (funciona em Android/desktop; no iPhone o CSS já cobre a tela)
  btnFull.addEventListener("click", function(){
    var el = document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen){
      el.requestFullscreen().catch(function(){});
    } else if(document.fullscreenElement){
      document.exitFullscreen().catch(function(){});
    }
  });

  // dica de swipe some depois de 3,5s na primeira vez em paisagem
  var hintDone = false;
  function maybeHint(){
    if(hintDone) return;
    if(window.matchMedia("(orientation:landscape)").matches){
      hintDone = true;
      setTimeout(function(){ hint.classList.add("hide"); }, 3500);
    }
  }
  window.addEventListener("resize", maybeHint);
  window.addEventListener("orientationchange", maybeHint);

  render();
  maybeHint();
})();
</script>
</body>
</html>
