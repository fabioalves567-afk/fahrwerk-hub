<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001e50">
<title>FAHRWERK · Visualizador de Slides</title>
<style>
  :root{--vw-deep:#001226;--vw-blue:#001E50;--vw-blue2:#003087;--vw-accent:#0040C1;--vw-edge:rgba(255,255,255,.10);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--vw-deep);color:#fff;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}

  /* ===== LANÇADOR (em pé) ===== */
  .launcher{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:linear-gradient(165deg,#001226,#001E50 55%,#002a6e);}
  .launcher .deckTag{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#7fa4dc;font-weight:700;margin-bottom:6px;}
  .launcher .deckTitle{font-size:22px;font-weight:700;line-height:1.25;margin-bottom:34px;max-width:520px;}
  .phone{width:74px;height:132px;margin:0 auto 26px;border:4px solid #fff;border-radius:15px;position:relative;transform-origin:center;animation:tilt 2.6s ease-in-out infinite;}
  .phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:24px;height:4px;border-radius:3px;background:#fff;}
  .phone::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:16px;height:16px;border:3px solid #fff;border-radius:50%;}
  @keyframes tilt{0%,18%{transform:rotate(0deg);}50%,68%{transform:rotate(-90deg);}100%{transform:rotate(0deg);}}
  .launcher .msg{font-size:20px;font-weight:700;line-height:1.35;margin-bottom:8px;}
  .launcher .sub{font-size:15px;color:#a9c0e4;line-height:1.5;margin-bottom:30px;max-width:440px;}
  .fsBtn{border:0;border-radius:14px;padding:16px 30px;font-size:18px;font-weight:700;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--vw-accent),var(--vw-blue2));box-shadow:0 8px 26px rgba(0,64,193,.45);transition:transform .12s,box-shadow .12s;}
  .fsBtn:active{transform:scale(.96);box-shadow:0 4px 14px rgba(0,64,193,.4);}
  .launcher .count{margin-top:28px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--vw-edge);font-size:15px;font-weight:600;color:#cfe0f7;}

  /* ===== TELA CHEIA ===== */
  .fsStage{display:none;position:fixed;inset:0;z-index:9999;background:#000;}
  .fsRotor{position:fixed;background:#000;}
  .fsImg{width:100%;height:100%;object-fit:contain;display:block;background:#000;-webkit-user-drag:none;}
  body.fs .launcher{display:none;}
  body.fs .fsStage{display:block;}
  @media (orientation:portrait){
    body.fs .fsRotor{top:0;left:100vw;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg);}
  }
  @media (orientation:landscape){
    .launcher{display:none;}
    .fsStage{display:block;}
    .fsRotor{top:0;left:0;width:100vw;height:100dvh;transform:none;}
  }

  /* controles */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px 18px;background:linear-gradient(to bottom,rgba(0,8,24,.80),rgba(0,8,24,0));transition:opacity .25s ease;}
  .topbar .title{flex:1;font-size:16px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .count{font-size:14px;font-weight:600;color:#cfe0f7;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid var(--vw-edge);}
  .iconBtn{flex:none;width:40px;height:40px;border:1px solid var(--vw-edge);border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s;}
  .iconBtn:active{transform:scale(.92);background:var(--vw-accent);}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:58px;height:58px;border-radius:50%;background:rgba(0,12,30,.45);border:1px solid var(--vw-edge);color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);transition:background .15s,transform .1s,opacity .3s;}
  .arrow:active{transform:translateY(-50%) scale(.9);background:var(--vw-accent);}
  .arrow.prev{left:12px;} .arrow.next{right:12px;}
  .arrow.off{opacity:.22;pointer-events:none;}
  .swipeHint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;font-size:13px;color:#cfe0f7;background:rgba(0,12,30,.6);padding:7px 16px;border-radius:999px;border:1px solid var(--vw-edge);transition:opacity .6s;}
  .swipeHint.hide{opacity:0;}

  /* >>> na horizontal: esconde TOPO e RODAPÉ por padrão; toque revela <<< */
  body.chrome-off .topbar{opacity:0;pointer-events:none;}
</style>
</head>
<body>

  <div class="launcher">
    <div class="deckTag">Fahrwerk · Apresentação</div>
    <div class="deckTitle" id="launchTitle">—</div>
    <div class="phone" aria-hidden="true"></div>
    <div class="msg">Vire o celular para melhor visualização</div>
    <div class="sub">Ou toque no botão abaixo — o slide abre deitado, ocupando a tela inteira (funciona mesmo com a rotação travada).</div>
    <button class="fsBtn" id="btnOpen">⛶ Abrir em tela cheia</button>
    <div class="count" id="launchCount">— / —</div>
  </div>

  <div class="fsStage" id="fsStage">
    <div class="fsRotor">
      <img class="fsImg" id="fsImg" alt="">
      <div class="topbar">
        <button class="iconBtn" id="btnClose" aria-label="Fechar">✕</button>
        <div class="title" id="fsTitle">—</div>
        <div class="count" id="fsCount">— / —</div>
      </div>
      <button class="arrow prev" id="btnPrev" aria-label="Anterior">‹</button>
      <button class="arrow next" id="btnNext" aria-label="Próximo">›</button>
      <div class="swipeHint" id="swipeHint">Toque na tela para mostrar/ocultar os botões · deslize para navegar</div>
    </div>
  </div>

<script>
/* ===== CONFIGURAÇÃO — só mexa aqui ===== */
var DECK_TITLE = "Fahrwerk: Engenharia de Precisão Automotiva";
var SLIDES = [
  // "https://fabioalves567-afk.github.io/fahrwerk-hub/img/slide1.png",
];
/* ======================================== */

(function(){
  "use strict";
  function demo(n,total){
    var svg="<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='800' viewBox='0 0 1280 800'>"+
      "<rect width='1280' height='800' fill='#eef2f7'/><rect width='1280' height='112' fill='#001E50'/>"+
      "<text x='48' y='72' font-family='Segoe UI,sans-serif' font-size='38' font-weight='700' fill='#fff'>"+DECK_TITLE+"</text>"+
      "<text x='1232' y='72' text-anchor='end' font-family='Segoe UI,sans-serif' font-size='34' fill='#9db4d6'>"+n+"/"+total+"</text>"+
      "<text x='48' y='560' font-family='Segoe UI,sans-serif' font-size='240' font-weight='800' fill='#001E50' opacity='0.10'>"+n+"</text>"+
      "<text x='48' y='280' font-family='Segoe UI,sans-serif' font-size='34' fill='#33425a'>Slide de exemplo — substitua pela sua imagem real.</text></svg>";
    return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
  }
  if(!SLIDES||SLIDES.length===0){SLIDES=[];for(var i=1;i<=15;i++)SLIDES.push(demo(i,15));}

  var idx=0,total=SLIDES.length,body=document.body;
  var img=document.getElementById("fsImg");
  var fsTitle=document.getElementById("fsTitle"),fsCount=document.getElementById("fsCount");
  var launchTitle=document.getElementById("launchTitle"),launchCount=document.getElementById("launchCount");
  var btnPrev=document.getElementById("btnPrev"),btnNext=document.getElementById("btnNext");
  var btnOpen=document.getElementById("btnOpen"),btnClose=document.getElementById("btnClose");
  var hint=document.getElementById("swipeHint"),stage=document.getElementById("fsStage");

  function preload(n){if(n>=0&&n<total){var im=new Image();im.src=SLIDES[n];}}
  function render(){
    img.src=SLIDES[idx];img.alt=DECK_TITLE+" — slide "+(idx+1)+" de "+total;
    var label=(idx+1)+" / "+total;
    fsTitle.textContent=DECK_TITLE;launchTitle.textContent=DECK_TITLE;
    fsCount.textContent=label;launchCount.textContent=label;
    btnPrev.classList.toggle("off",idx===0);btnNext.classList.toggle("off",idx===total-1);
    preload(idx+1);preload(idx-1);
  }
  function go(d){var n=idx+d;if(n<0||n>total-1)return;idx=n;render();}

  // começa sempre limpo (sem topo) na tela cheia
  body.classList.add("chrome-off");
  function showChrome(){body.classList.remove("chrome-off");}
  function toggleChrome(){body.classList.toggle("chrome-off");}

  function openFS(){
    body.classList.add("fs");body.classList.add("chrome-off");
    var el=document.documentElement;
    if(el.requestFullscreen){el.requestFullscreen().then(lockLand).catch(lockLand);}else{lockLand();}
    introHint();
  }
  function lockLand(){try{if(screen.orientation&&screen.orientation.lock){screen.orientation.lock("landscape").catch(function(){});}}catch(e){}}
  function closeFS(){
    body.classList.remove("fs");
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
    if(document.fullscreenElement){document.exitFullscreen().catch(function(){});}
    try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:"fahrwerk-slides-close"},"*");}}catch(e){}
  }

  btnOpen.addEventListener("click",openFS);
  btnClose.addEventListener("click",function(e){e.stopPropagation();closeFS();});
  btnPrev.addEventListener("click",function(e){e.stopPropagation();go(-1);});
  btnNext.addEventListener("click",function(e){e.stopPropagation();go(1);});

  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft")go(-1);
    if(e.key==="ArrowRight")go(1);
    if(e.key==="Escape")closeFS();
  });
  document.addEventListener("fullscreenchange",function(){
    if(!document.fullscreenElement){body.classList.remove("fs");try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}}
  });

  // toque/clique: deslizar = navegar | toque curto = mostrar/ocultar controles
  var x0=null,y0=null,recentTouch=0;
  stage.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  stage.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    var moved=Math.abs(dx)>=45||Math.abs(dy)>=45;
    if(moved){ if(Math.abs(dx)>=Math.abs(dy))go(dx<0?1:-1); else go(dy<0?1:-1); }
    else if(!e.target.closest(".topbar")&&!e.target.closest(".arrow")){ toggleChrome(); }
    x0=null;recentTouch=Date.now();
  },{passive:true});
  stage.addEventListener("click",function(e){
    if(Date.now()-recentTouch<600)return; // já tratado pelo toque
    if(e.target.closest(".topbar")||e.target.closest(".arrow"))return;
    toggleChrome();
  });

  var introDone=false;
  function introHint(){
    if(introDone)return;introDone=true;
    hint.classList.remove("hide");
    setTimeout(function(){hint.classList.add("hide");},3500);
  }
  window.addEventListener("resize",function(){if(window.matchMedia("(orientation:landscape)").matches)introHint();});

  render();
})();
</script>
</body>
</html>
