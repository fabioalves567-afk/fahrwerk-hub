<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001e50">
<title>FAHRWERK · Visualizador de Slides</title>
<style>
  :root{
    --vw-deep:#001226; --vw-blue:#001E50; --vw-blue2:#003087; --vw-accent:#0040C1;
    --vw-edge:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--vw-deep);color:#fff;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  }

  /* ===== LANÇADOR (em pé) ===== */
  .launcher{
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px;
    background:linear-gradient(165deg,#001226,#001E50 55%,#002a6e);
  }
  .launcher .deckTag{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#7fa4dc;font-weight:700;margin-bottom:6px;}
  .launcher .deckTitle{font-size:22px;font-weight:700;line-height:1.25;margin-bottom:34px;max-width:520px;}
  .phone{width:74px;height:132px;margin:0 auto 26px;border:4px solid #fff;border-radius:15px;position:relative;transform-origin:center;animation:tilt 2.6s ease-in-out infinite;}
  .phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:24px;height:4px;border-radius:3px;background:#fff;}
  .phone::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:16px;height:16px;border:3px solid #fff;border-radius:50%;}
  @keyframes tilt{0%,18%{transform:rotate(0deg);}50%,68%{transform:rotate(-90deg);}100%{transform:rotate(0deg);}}
  .launcher .msg{font-size:20px;font-weight:700;line-height:1.35;margin-bottom:8px;}
  .launcher .sub{font-size:15px;color:#a9c0e4;line-height:1.5;margin-bottom:30px;max-width:440px;}
  .fsBtn{border:0;border-radius:14px;padding:16px 30px;font-size:18px;font-weight:700;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--vw-accent),var(--vw-blue2));box-shadow:0 8px 26px rgba(0,64,193,.45);transition:transform .12s,box-shadow .12s;}
  .fsBtn:active{transform:scale(.96);}
  .launcher .count{margin-top:28px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--vw-edge);font-size:15px;font-weight:600;color:#cfe0f7;}

  /* ===== PALCO TELA CHEIA ===== */
  .fsStage{display:none;position:fixed;inset:0;z-index:9999;background:#000;}
  .fsRotor{position:fixed;background:#000;}
  .fsImg{width:100%;height:100%;object-fit:cover;display:block;background:#000;-webkit-user-drag:none;}
  .fsImg.contain{object-fit:contain;}

  body.fs .launcher{display:none;}
  body.fs .fsStage{display:block;}
  @media (orientation:portrait){
    body.fs .fsRotor{top:0;left:100vw;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg);}
  }
  @media (orientation:landscape){
    .launcher{display:none;}
    .fsStage{display:block;}
    .fsRotor{top:0;left:0;width:100vw;height:100dvh;transform:none;}
  }

  /* ===== HUD (controles que somem sozinhos) ===== */
  .hud{transition:opacity .28s ease;}
  .fsStage.hud-off .hud{opacity:0;pointer-events:none;}

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:12px 16px 16px;background:linear-gradient(to bottom,rgba(0,8,24,.82),rgba(0,8,24,0));
  }
  .topbar .title{flex:1;font-size:16px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .count{font-size:14px;font-weight:600;color:#cfe0f7;padding:6px 13px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid var(--vw-edge);}
  .iconBtn{flex:none;width:40px;height:40px;border:1px solid var(--vw-edge);border-radius:12px;background:rgba(0,0,0,.5);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s;}
  .iconBtn:active{transform:scale(.92);background:var(--vw-accent);}
  .pillBtn{font-family:inherit;font-size:13px;font-weight:600;color:#cfe0f7;padding:7px 13px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid var(--vw-edge);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;}
  .pillBtn:active{background:var(--vw-accent);color:#fff;}

  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:56px;height:56px;border-radius:50%;background:rgba(0,12,30,.5);border:1px solid var(--vw-edge);color:#fff;font-size:29px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);transition:background .15s,transform .1s,opacity .28s;}
  .arrow:active{transform:translateY(-50%) scale(.9);background:var(--vw-accent);}
  .arrow.prev{left:10px;} .arrow.next{right:10px;}
  .arrow.off{opacity:.2;pointer-events:none;}

  /* dica única de uso, aparece só na 1ª vez e some junto com o HUD */
  .tapHint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;font-size:13px;color:#cfe0f7;background:rgba(0,12,30,.6);padding:8px 16px;border-radius:999px;border:1px solid var(--vw-edge);}
</style>
</head>
<body>

  <!-- ===== TELA INICIAL ===== -->
  <div class="launcher">
    <div class="deckTag">Fahrwerk · Apresentação</div>
    <div class="deckTitle" id="launchTitle">—</div>
    <div class="phone" aria-hidden="true"></div>
    <div class="msg">Vire o celular para melhor visualização</div>
    <div class="sub">Ou toque no botão abaixo — o slide abre deitado, ocupando a tela inteira.</div>
    <button class="fsBtn" id="btnOpen">⛶ Abrir em tela cheia</button>
    <div class="count" id="launchCount">— / —</div>
  </div>

  <!-- ===== TELA CHEIA ===== -->
  <div class="fsStage" id="fsStage">
    <div class="fsRotor">
      <img class="fsImg" id="fsImg" alt="">
      <div class="topbar hud">
        <button class="iconBtn" id="btnClose" aria-label="Fechar">✕</button>
        <div class="title" id="fsTitle">—</div>
        <button class="pillBtn" id="btnFit" aria-label="Alternar preenchimento">Preencher</button>
        <div class="count" id="fsCount">— / —</div>
      </div>
      <button class="arrow prev hud" id="btnPrev" aria-label="Anterior">‹</button>
      <button class="arrow next hud" id="btnNext" aria-label="Próximo">›</button>
      <div class="tapHint hud" id="tapHint">Toque no slide para mostrar ou ocultar os controles</div>
    </div>
  </div>

<script>
/* ============================================================
   CONFIGURAÇÃO — só mexa aqui
   ============================================================ */
var DECK_TITLE = "Proteção das Mãos — Risco Mecânico";

// URLs (ou base64 "data:image/...") das suas imagens, NA ORDEM. Vazio = 9 exemplos.
var SLIDES = [
  // "https://fabioalves567-afk.github.io/fahrwerk-hub/img/maos_1.png",
];
/* ============================================================ */

(function(){
  "use strict";

  function demo(n,total){
    var svg="<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='800' viewBox='0 0 1280 800'>"+
      "<rect width='1280' height='800' fill='#eef2f7'/><rect width='1280' height='112' fill='#001E50'/>"+
      "<text x='48' y='72' font-family='Segoe UI,sans-serif' font-size='40' font-weight='700' fill='#fff'>"+DECK_TITLE+"</text>"+
      "<text x='1232' y='72' text-anchor='end' font-family='Segoe UI,sans-serif' font-size='34' fill='#9db4d6'>"+n+"/"+total+"</text>"+
      "<text x='48' y='560' font-family='Segoe UI,sans-serif' font-size='240' font-weight='800' fill='#001E50' opacity='0.10'>"+n+"</text>"+
      "<text x='48' y='280' font-family='Segoe UI,sans-serif' font-size='34' fill='#33425a'>Slide de exemplo — substitua pela sua imagem real.</text></svg>";
    return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
  }
  if(!SLIDES||SLIDES.length===0){SLIDES=[];for(var i=1;i<=9;i++)SLIDES.push(demo(i,9));}

  var idx=0,total=SLIDES.length,body=document.body;
  var img=document.getElementById("fsImg");
  var fsTitle=document.getElementById("fsTitle"),fsCount=document.getElementById("fsCount");
  var launchTitle=document.getElementById("launchTitle"),launchCount=document.getElementById("launchCount");
  var btnPrev=document.getElementById("btnPrev"),btnNext=document.getElementById("btnNext");
  var btnOpen=document.getElementById("btnOpen"),btnClose=document.getElementById("btnClose");
  var btnFit=document.getElementById("btnFit");
  var stage=document.getElementById("fsStage"),tapHint=document.getElementById("tapHint");

  /* ---- ajuste do slide (memória) ---- */
  var FIT_KEY="fahrwerk_slides_fit_v1",fitMode="cover";
  try{ if(localStorage.getItem(FIT_KEY)==="contain") fitMode="contain"; }catch(e){}
  function applyFit(){
    img.classList.toggle("contain",fitMode==="contain");
    btnFit.textContent=(fitMode==="contain")?"Inteiro":"Preencher";
    try{ localStorage.setItem(FIT_KEY,fitMode); }catch(e){}
  }
  btnFit.addEventListener("click",function(){ fitMode=(fitMode==="contain")?"cover":"contain"; applyFit(); showHud(); });

  /* ---- HUD que some sozinho ---- */
  var hudTimer=null;
  function showHud(){ stage.classList.remove("hud-off"); clearTimeout(hudTimer); hudTimer=setTimeout(hideHud,2800); }
  function hideHud(){ stage.classList.add("hud-off"); clearTimeout(hudTimer); if(tapHint) tapHint.style.display="none"; }
  function toggleHud(){ stage.classList.contains("hud-off") ? showHud() : hideHud(); }

  /* ---- slides ---- */
  function preload(n){ if(n>=0&&n<total){var im=new Image();im.src=SLIDES[n];} }
  function render(){
    img.src=SLIDES[idx]; img.alt=DECK_TITLE+" — slide "+(idx+1)+" de "+total;
    var label=(idx+1)+" / "+total;
    fsTitle.textContent=DECK_TITLE; launchTitle.textContent=DECK_TITLE;
    fsCount.textContent=label; launchCount.textContent=label;
    btnPrev.classList.toggle("off",idx===0);
    btnNext.classList.toggle("off",idx===total-1);
    preload(idx+1); preload(idx-1);
  }
  function go(d){ var n=idx+d; if(n<0||n>total-1)return; idx=n; render(); showHud(); }

  /* ---- tela cheia ---- */
  function openFS(){
    body.classList.add("fs");
    var el=document.documentElement;
    if(el.requestFullscreen){ el.requestFullscreen().then(lockLand).catch(lockLand); } else { lockLand(); }
    showHud();
  }
  function lockLand(){ try{ if(screen.orientation&&screen.orientation.lock){ screen.orientation.lock("landscape").catch(function(){}); } }catch(e){} }
  function closeFS(){
    body.classList.remove("fs");
    try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); }
    try{ if(window.parent&&window.parent!==window){ window.parent.postMessage({type:"fahrwerk-slides-close"},"*"); } }catch(e){}
  }

  btnOpen.addEventListener("click",openFS);
  btnClose.addEventListener("click",function(e){ e.stopPropagation(); closeFS(); });
  btnPrev.addEventListener("click",function(e){ e.stopPropagation(); go(-1); });
  btnNext.addEventListener("click",function(e){ e.stopPropagation(); go(1); });

  // tocar no slide mostra/oculta os controles
  img.addEventListener("click",toggleHud);

  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft")go(-1);
    if(e.key==="ArrowRight")go(1);
    if(e.key==="Escape")closeFS();
  });
  document.addEventListener("fullscreenchange",function(){
    if(!document.fullscreenElement){
      body.classList.remove("fs");
      try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    }
  });

  // swipe: só navega em movimento grande; toque pequeno é tratado pelo click do slide
  var x0=null,y0=null;
  stage.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  stage.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>=45||Math.abs(dy)>=45){ (Math.abs(dx)>=Math.abs(dy)) ? go(dx<0?1:-1) : go(dy<0?1:-1); }
    x0=null;
  },{passive:true});

  // entra deitado pelo giro físico
  window.addEventListener("resize",function(){ if(window.matchMedia("(orientation:landscape)").matches) showHud(); });

  applyFit();
  render();
})();
</script>
</body>
</html>
